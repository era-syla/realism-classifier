data:
  embeddings_path: data/embeddings.npz
  metadata_csv: data/metadata.csv
  embedding_dim: 768
  num_workers: 0
  pin_memory: true
model:
  hidden_dims:
  - 512
  - 256
  - 128
  dropout: 0.3
  activation: relu
  use_batch_norm: true
training:
  batch_size: 256
  max_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler:
    type: cosine
    warmup_epochs: 3
    T_max: 50
    step_size: 20
    gamma: 0.5
    patience: 5
  early_stopping:
    enabled: true
    patience: 10
    metric: val_auc
    min_delta: 0.0001
    mode: max
  pos_weight: 1.0
checkpointing:
  output_dir: outputs/runs
  save_best_only: true
  checkpoint_metric: val_auc
evaluation:
  threshold: 0.5
  per_dataset_report: true
inference:
  checkpoint_path: ''
  embeddings_path: null
  metadata_csv: null
  output_csv: outputs/inference_scores.csv
  batch_size: 512
comparison:
  scores_dir: outputs/scores
  output_dir: outputs/comparison
  plot_format: png
  top_k: null
seed: 42
device: auto
